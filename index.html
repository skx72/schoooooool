
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사이트 점검</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #ffffff;
  color: #1f2328;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  padding: 70px 20px;
}

.container {
  max-width: 650px;
  margin: auto;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 22px;
  border-bottom: 1px solid #d1d9e0;
  margin-bottom: 35px;
}

.header svg {
  width: 25px;
  height: 25px;
}

.header span {
  font-size: 15px;
  font-weight: 600;
}

h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.7px;
  margin-bottom: 12px;
}

.description {
  color: #59636e;
  font-size: 14px;
  line-height: 1.7;
}

.card {
  border: 1px solid #d1d9e0;
  border-radius: 6px;
  margin-top: 28px;
  overflow: hidden;
}

.card-title {
  background: #f6f8fa;
  border-bottom: 1px solid #d1d9e0;
  padding: 13px 16px;
  font-size: 13px;
  font-weight: 600;
}

.card-content {
  padding: 18px 16px;
}

.date {
  font-size: 16px;
  font-weight: 600;
}

.list {
  padding: 8px 16px;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  font-size: 14px;
  border-bottom: 1px solid #eaeef2;
}

.item:last-child {
  border-bottom: none;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #1f883d;
  flex-shrink: 0;
}

.contact {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid #d1d9e0;
  font-size: 13px;
  color: #59636e;
}

a {
  color: #0969da;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

@media(max-width: 500px) {
  body {
    padding: 35px 17px;
  }

  h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.7">
      <path d="M12 2L20 5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5L12 2Z"/>
      <path d="M9 12L11 14L15 10"/>
    </svg>
    <span>Security Notice</span>
  </div>

  <h1>사이트 보안 점검 안내</h1>

  <p class="description">
    서비스 안정성 및 보안 강화를 위한
    시스템 업데이트와 기술 점검이 진행될 예정입니다.
  </p>

  <div class="card">
    <div class="card-title">점검 일정</div>
    <div class="card-content">
      <div class="date" id="date">계산 중...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">점검 항목</div>
    <div class="list">

      <div class="item">
        <span class="dot"></span>
        사이트 소스 코드 보안 검토 및 업데이트
      </div>

      <div class="item">
        <span class="dot"></span>
        API 인증 및 접근 권한 보안 점검
      </div>

      <div class="item">
        <span class="dot"></span>
        API 요청 및 응답 데이터 보안 검토
      </div>

      <div class="item">
        <span class="dot"></span>
        서버 환경 설정 및 보안 패치 적용
      </div>

    </div>
  </div>

  <div class="contact">
    문의 사항<br>
    <a href="mailto:junseo100214@gmail.com">
      junseo100214@gmail.com
    </a>
  </div>

</div>

<script>
const inspectionDate = new Date(
  Date.now() + 32 * 60 * 60 * 1000
);

document.getElementById("date").textContent =
  new Intl.DateTimeFormat("ko-KR", {
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "long",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(inspectionDate);
</script>

</body>
</html>
